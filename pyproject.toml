[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "RAG_production_system"
version = "0.1.0"
description = "Transform a learning project of RAG with all used concepts and algorithms to production ready system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [

    # Semantic embeddings and SentenceTransformer models
    "sentence-transformers==6.3.0",
    # Explicitly pinned because sentence-transformers uses PyTorch underneath.
    "torch==2.10.0",
    # Used by embedding conversion and numerical utilities.
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

# Tell Hatchling where to find the package
[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# --- Linter & Formatter (Ruff) ---
[tool.ruff]
line-length = 119
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E/W), isort (I), and pyupgrade (UP)
select = ["E", "W", "F", "I", "UP"]

# --- Static Type Checker (Mypy) ---
[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
packages = ["rag"]
strict = true
ignore_missing_imports = true